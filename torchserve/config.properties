# TorchServe configuration

# Inference address
inference_address=http://0.0.0.0:8080

# Management address
management_address=http://0.0.0.0:8081

# Metrics address
metrics_address=http://0.0.0.0:8082

# Number of workers per model
default_workers_per_model=2

# Response timeout in seconds
default_response_timeout=120

# Enable CORS
enable_envvars_config=true

# Disable token authorization for testing
disable_token_authorization=true

# Model store location
model_store=/home/model-server/model-store

# Load models at startup
load_models=all

# Job queue size
job_queue_size=100

# Max request size (in MB)
max_request_size=100

# Max response size (in MB)
max_response_size=100

# Enable metrics
enable_metrics_api=true

# Logging
# Options: DEBUG, INFO, WARN, ERROR
default_service_handler=ts.torch_handler.base_handler

# Service envelope: use 'body' to pass raw data directly to handler
# This allows handler to process binary image data directly
service_envelope=body
