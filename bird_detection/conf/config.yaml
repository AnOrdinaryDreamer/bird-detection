defaults:
  - data: dataset
  - model: ssd
  - training: default
  - logging: default
  - augmentations: default
  - mlflow: default
  - _self_

seed: 42

# Hydra configuration - use fixed output directory for DVC
hydra:
  run:
    dir: outputs/current_run
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
