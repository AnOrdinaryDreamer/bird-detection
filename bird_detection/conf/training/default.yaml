batch_size: 4
num_workers: 4
pin_memory: true
epochs: 5
optimizer: adam
lr: 0.0001
momentum: 0.9
weight_decay: 0.0
betas: [0.9, 0.999]
eps: 1.0e-8
lr_scheduler:
  milestones: [8, 11]
  gamma: 0.1
grad_clip: 1.0
amp: false
log_every: 25
resume_from: null
checkpoint_dir: ${hydra:run.dir}/checkpoints
model_dir: ${hydra:run.dir}/trained_model
