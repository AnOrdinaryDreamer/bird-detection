[tool.poetry]
name = "bird-detection"
version = "0.1.0"
description = "Training pipeline for the bird detection project"
authors = ["Svetlana Glazyrina <sglazyrina@atlas-it-solutions.ru>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
albumentations = "^2.0.8"
hydra-core = "^1.3.2"
omegaconf = "^2.3.0"
opencv-python-headless = "4.10.0.84"
tensorboard = "^2.20.0"
torch = "^2.2.1"
torchvision = "^0.17.1"
tqdm = "^4.67.1"
numpy = ">=1.24.4,<2.0"
dvc = "^3.66.1"
dvc-s3 = "^3.2.2"
matplotlib = "^3.10.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
black = "^24.4.2"

[[tool.poetry.source]]
name = "pypi"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
